<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Painel de Efetividade</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--dk:#176a1f}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;height:100%;background:#fff;overflow:hidden;font-family:"Segoe UI",system-ui,Arial,sans-serif;color:#2b2f2b}
#st{--t2:4.2s;position:absolute;left:50%;top:50%;width:1920px;height:1080px;background:#fff;overflow:hidden}
h1{position:absolute;left:64px;top:22px;margin:0;font-size:62px;font-weight:800;color:var(--dk)}
#hd{position:absolute;right:64px;top:22px;text-align:right}
#hd b{display:block;font-size:42px;color:var(--dk)}
#hd span{display:block;font-size:20px;color:#667}
#pn{position:absolute;left:64px;top:118px;width:1792px;height:138px;padding:14px 22px;background:#f2f6f2;border-radius:18px;display:flex;flex-direction:column;justify-content:space-between}
.rw{display:flex;gap:16px;align-items:flex-end}
.fd{display:flex;flex-direction:column;gap:4px;font-size:15px;font-weight:600;color:#556}
input,select{width:150px;height:50px;padding:0 12px;border:2px solid var(--c,#c9d2c9);border-left-width:8px;border-radius:10px;background:#fff;font:600 24px "Segoe UI",system-ui,Arial,sans-serif;color:#222}
.bt{height:50px;padding:0 22px;border:2px solid var(--dk);border-radius:10px;background:var(--dk);color:#fff;font:700 18px "Segoe UI",system-ui,Arial,sans-serif;display:inline-flex;align-items:center;cursor:pointer}
.bt.g{background:#fff;color:var(--dk)}
.ht{font-size:15px;color:#667}
code{background:#e3eae3;padding:1px 6px;border-radius:5px}
#cd{position:absolute;left:64px;top:272px;width:1792px;display:grid;grid-template-columns:repeat(4,1fr);gap:22px}
.cd{position:relative;display:block;padding:16px 18px 14px;border:2px solid #e1e7e1;border-radius:18px;background:#fff;text-align:center;font-family:inherit;color:#2b2f2b;cursor:pointer;transition:.3s}
.cd:hover{border-color:var(--cc)}
.cd:focus-visible{outline:3px solid var(--cc);outline-offset:3px}
.cd.on{border-color:var(--cc);background:color-mix(in srgb,var(--cc) 9%,#fff);box-shadow:0 10px 26px rgba(0,0,0,.13)}
.tt{display:block;font-size:30px;font-weight:800;color:var(--cc)}
.sb{display:block;font-size:19px;color:var(--cc);margin-bottom:10px}
.ch{display:flex;justify-content:center;align-items:center;gap:14px;margin-bottom:10px}
.pc{min-width:150px;padding:4px 12px;border-radius:12px;background:var(--cc);color:#fff;font-size:42px;font-weight:800}
.ct{font-size:20px;font-weight:700;color:var(--cc);text-align:left;line-height:1.15}
.ds{display:block;margin-bottom:6px;font-size:19px;line-height:1.3}
.ds b{color:var(--dk)}
.cd small{display:block;font-size:17px;color:#555}
.sw{position:absolute;right:16px;top:16px;width:52px;height:28px;border-radius:14px;background:#cfd6cf;transition:.3s}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.3s}
.on>.sw{background:var(--cc)}
.on>.sw::after{left:27px}
#sc{position:absolute;left:0;top:560px;width:1920px;height:460px}
#bg{position:absolute;inset:0;z-index:2;animation:bob var(--bob,4s) ease-in-out infinite}
#bt{position:absolute;left:100px;top:250px;width:1720px;height:64px;border-radius:30px 90px 70px 30px;background:linear-gradient(#ffb92e,#f08a00);box-shadow:inset 0 -10px 0 rgba(0,0,0,.14);overflow:hidden;color:#fff;font-size:26px;font-weight:800;letter-spacing:.12em;line-height:64px;text-align:center;text-transform:uppercase}
#cr{position:absolute;inset:0}
.wv{position:absolute;left:0;width:2400px;animation:sl var(--w,12s) linear infinite}
#w1{top:244px;height:216px;opacity:.62;z-index:3}
#w2{top:287px;height:173px;z-index:4;animation-duration:calc(var(--w,12s)*.7)}
@keyframes sl{to{transform:translateX(-240px)}}
@keyframes bob{50%{transform:translateY(-9px) rotate(-.5deg)}}
#ft,#lg{position:absolute;top:1038px;font-size:20px;color:#666}
#ft{left:64px}#lg{right:64px}
/* pessoas */
.p{position:absolute;overflow:visible;--c:#b9bec5;--c2:#9ea5ad;--a:var(--t) ease-in-out var(--dl) infinite}
.kd,.ki{--a:var(--t2) ease-in-out var(--dl) infinite}
.sf{fill:var(--c);transition:fill .6s}
.ss{fill:none;stroke:var(--c2);stroke-width:9;stroke-linecap:round;transition:stroke .6s}
.ke.on{--c:#5aa63a;--c2:#3e8526}.kf.on{--c:#f2b01e;--c2:#c98f10}.kd.on{--c:#2f7fd6;--c2:#1f5fa8}.ki.on{--c:#d9433f;--c2:#a82f2c}
.bd{transform-origin:31px 88px;transition:transform .8s}
.hd{transform-origin:31px 40px;transition:transform .8s}
.ar{transform-origin:31px 48px;transform:rotate(-5deg);transition:transform .8s}
.fa{transform-origin:31px 76px;transform:rotate(-40deg);transition:transform .8s}
.oar{transform-origin:66px 80px;transform:rotate(-30deg)}
.bn{opacity:0;transition:opacity .8s}
.ke .ar{transform:rotate(-25deg)}.ke .fa{transform:rotate(-45deg)}
/* Efetivo: remo */
.ke.on .bd{animation:rB var(--a)}.ke.on .ar{animation:rA var(--a)}.ke.on .fa{animation:rF var(--a)}.ke.on .oar{animation:rO var(--a)}
@keyframes rB{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(9deg)}}
@keyframes rA{0%,100%{transform:rotate(-40deg)}50%{transform:rotate(0)}}
@keyframes rF{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(-100deg)}}
@keyframes rO{0%,100%{transform:rotate(-46deg)}50%{transform:rotate(-14deg)}}
/* Frustrado: mão na água */
.kf.on .bd{animation:fB var(--a)}.kf.on .ar{animation:fA var(--a)}.kf.on .fa{animation:fF var(--a)}
@keyframes fB{0%,100%{transform:rotate(10deg)}50%{transform:rotate(15deg)}}
@keyframes fA{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(16deg)}}
@keyframes fF{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(10deg)}}
/* Deslocado: binóculo */
.kd.on .ar{transform:rotate(-60deg)}.kd.on .fa{transform:rotate(-136deg)}.kd.on .bn{opacity:1}
.kd.on .hd{animation:sc var(--a)}
@keyframes sc{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(6deg)}}
/* Inefetivo: cabisbaixo, mãos paradas */
.ki.on .bd{transform:rotate(8deg)}.ki.on .hd{transform:rotate(28deg);animation:sg var(--a) alternate}
@keyframes sg{0%{transform:rotate(24deg)}100%{transform:rotate(32deg)}}
</style></head><body>
<div id="st">
<h1>Resultado Efetividade</h1>
<div id="hd"><b id="hn"></b><span id="hs1"></span><span id="hs2"></span></div>
<div id="pn">
 <div class="rw">
  <label class="fd">Unidade<input id="nm" style="width:340px" maxlength="40"></label>
  <label class="fd" style="--c:#5aa63a">Efetivo<input id="v0" type="number" min="0"></label>
  <label class="fd" style="--c:#f2b01e">Frustrado<input id="v1" type="number" min="0"></label>
  <label class="fd" style="--c:#2f7fd6">Deslocado<input id="v2" type="number" min="0"></label>
  <label class="fd" style="--c:#d9433f">Inefetivo<input id="v3" type="number" min="0"></label>
  <label class="fd" id="ul" hidden>Unidades importadas<select id="us" style="width:260px"></select></label>
  <span style="flex:1"></span>
  <label class="bt">Importar CSV<input id="fl" type="file" accept=".csv,text/csv" hidden></label>
  <button class="bt g" id="ex">Carregar exemplo</button>
  <button class="bt" id="al">Ativar todos</button>
 </div>
 <div class="ht">Modelo do CSV (separador ; ou ,), uma linha por unidade: <code>unidade;efetivo;frustrado;deslocado;inefetivo</code> e depois, por exemplo, <code>Unidade A;52;60;8;78</code> <b id="ms"></b></div>
</div>
<div id="cd"></div>
<div id="sc"><div id="bg"><div id="bt"><span id="bn"></span></div><div id="cr"></div></div><div class="wv" id="w1"></div><div class="wv" id="w2"></div></div>
<div id="ft">Fonte: Korn Ferry</div><div id="lg"></div>
</div>
<script>
const $=s=>document.querySelector(s),st=$('#st'),K='efdi',fm=p=>p.toLocaleString('pt-BR',{maximumFractionDigits:1})+'%';
const S=[
{n:'EFETIVO',s:'(remando a todo vapor)',c:'#5aa63a',d:'Estou <b>altamente engajado</b> e também <b>tenho o suporte</b> da organização',e:'+',u:'+'},
{n:'FRUSTRADO',s:'(remando sem o remo)',c:'#d99a0b',d:'Não tenho o suporte para ser produtivo <b>mesmo estando altamente engajado</b>',e:'+',u:'−'},
{n:'DESLOCADO',s:'(apreciando a vista)',c:'#2f7fd6',d:'<b>Possuo o suporte</b> para ser produtivo, mas não estou engajado',e:'−',u:'+'},
{n:'INEFETIVO',s:'(afundando o barco)',c:'#d9433f',d:'<b>Não possuo</b> o suporte para ser produtivo e <b>não estou engajado</b>',e:'−',u:'−'}];
const SK=['#f3c9a5','#e0a67a','#c58a5c','#9a6a46'],HR=['#3b2a1a','#171717','#8a5a2b','#d9a441','#5a3825'];
const SAMPLE='unidade;efetivo;frustrado;deslocado;inefetivo\nUnidade A;52;60;8;78\nUnidade B;120;40;10;30\nUnidade C;15;30;5;150';
let U=[{n:'Unidade Modelo',v:[52,60,8,78]}],cur=0,on={e:0,f:0,d:0,i:0};

$('#cd').innerHTML=S.map((s,i)=>`<button class="cd" data-k="${K[i]}" aria-pressed="false" style="--cc:${s.c}"><span class="sw"></span><span class="tt">${s.n}</span><span class="sb">${s.s}</span><span class="ch"><span class="pc" id="p${i}"></span><span class="ct" id="n${i}"></span></span><span class="ds">${s.d}</span><small>${s.e} Engajamento</small><small>${s.u} Suporte</small></button>`).join('');

const wave=c=>`url("data:image/svg+xml,${encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' width='240' height='60'><path d='M0 30Q60 0 120 30T240 30V60H0Z' fill='${c}'/></svg>`)}")`;
const wbg=(c,x)=>`${wave(c)} ${x}px 0/240px 60px repeat-x,linear-gradient(${c},${c}) 0 59px/100% 100% no-repeat`;
$('#w1').style.background=wbg('#25b9cc',0);
$('#w2').style.background=wbg('#0c93ad',120);

function alloc(v,N){const T=v.reduce((a,b)=>a+b,0);if(!T)return[0,0,0,0];
 const n=Math.min(T,N),a=v.map(x=>x*n/T),b=a.map(Math.floor);
 v.forEach((x,i)=>{if(x>0&&!b[i])b[i]=1});
 let r=n-b.reduce((s,x)=>s+x,0);
 const o=a.map((x,i)=>[x%1,i]).sort((p,q)=>q[0]-p[0]);
 for(let j=0;r>0;j=(j+1)%4)if(v[o[j][1]]>0){b[o[j][1]]++;r--}
 while(r<0){b[b.indexOf(Math.max(...b))]--;r++}
 return b}

function fig(k,i,x,w,y){
 const sk=SK[(i*3)%4],hr=HR[(i*7)%5],dl=k=='e'?0:-((i*.43)%2.5).toFixed(2);
 const bn=k=='d'?'<g class="bn"><rect x="41" y="23" width="21" height="11" rx="4" fill="#2b2f36"/><rect x="58" y="21.5" width="6" height="14" rx="2.5" fill="#4a525c"/></g>':'';
 const oar=k=='e'?'<g class="oar"><path d="M66 56V160" stroke="#8a5a2b" stroke-width="3" stroke-linecap="round"/><rect x="62" y="136" width="8" height="26" rx="3" fill="#8a5a2b"/></g>':'';
 return `<svg class="p k${k}${on[k]?' on':''}" viewBox="0 0 60 100" style="left:${x}px;top:${y}px;width:${w}px;height:${w*5/3}px;--dl:${dl}s"><g class="bd"><rect class="sf" x="17" y="40" width="28" height="48" rx="11"/><g class="hd"><circle cx="31" cy="27" r="12" fill="${sk}"/><path d="M18.5 27A12.5 12.5 0 0 1 43.5 27Z" fill="${hr}"/><circle cx="39" cy="28" r="1.4" fill="#222"/>${bn}</g><g class="ar"><path class="ss" d="M31 48V76"/><g class="fa"><path class="ss" d="M31 76V106"/><circle cx="31" cy="107" r="4.6" fill="${sk}"/></g></g></g>${oar}</svg>`}

function render(){
 const u=U[cur],v=u.v,T=v.reduce((a,b)=>a+b,0),fl=T?(v[0]+v[1])/T:0;
 st.style.setProperty('--w',(12-9.8*fl).toFixed(2)+'s');
 st.style.setProperty('--t',(4.6-3.2*fl).toFixed(2)+'s');
 st.style.setProperty('--bob',(5.2-2.6*fl).toFixed(2)+'s');
 v.forEach((q,j)=>{$('#p'+j).textContent=fm(T?q*100/T:0);$('#n'+j).innerHTML=q+'<br>colab.'});
 $('#hn').textContent=u.n||'Unidade';$('#bn').textContent=u.n;
 $('#hs1').textContent=T+' colaboradores inscritos';
 $('#hs2').textContent='Propulsão (Efetivo + Frustrado): '+fm(fl*100);
 const n=Math.min(T,40),a=alloc(v,40),step=Math.min(80,1550/Math.max(n,1)),w=Math.max(40,Math.min(104,step*1.3)),hip=w*86/60,x0=150+(1550-n*step)/2;
 let h='',c=0;
 a.forEach((q,j)=>{for(let m=0;m<q;m++,c++)h+=fig(K[j],c,x0+c*step+(step-w)/2,w,256-hip)});
 $('#cr').innerHTML=h;
 $('#lg').textContent=T?(T>40?'1 figura ≈ '+(T/n).toFixed(1).replace('.',',')+' colaboradores':'1 figura = 1 colaborador'):'Informe a quantidade de colaboradores';
}
function tg(k,v){
 on[k]=v??!on[k];
 document.querySelectorAll('.k'+k).forEach(e=>e.classList.toggle('on',!!on[k]));
 const b=$(`.cd[data-k=${k}]`);b.classList.toggle('on',!!on[k]);b.setAttribute('aria-pressed',!!on[k]);
 $('#al').textContent=[...K].every(x=>on[x])?'Pausar todos':'Ativar todos';
}
function fillSel(){const s=$('#us');s.replaceChildren(...U.map((u,i)=>new Option(u.n||'(sem nome)',i)));s.value=cur;$('#ul').hidden=U.length<2}
function load(){const u=U[cur];$('#nm').value=u.n;u.v.forEach((q,j)=>$('#v'+j).value=q);render()}
function upd(){const u=U[cur];u.n=$('#nm').value;u.v=[0,1,2,3].map(j=>Math.max(0,Math.floor(+$('#v'+j).value||0)));if(U.length>1)fillSel();render()}
function csv(t){
 const L=t.replace(/^\uFEFF/,'').split(/\r?\n/).filter(x=>x.trim()),d=L[0]&&L[0].includes(';')?';':',';
 const num=x=>x!==''&&!isNaN(+x.replace(',','.'));
 return L.map(l=>l.split(d).map(c=>c.replace(/^"|"$/g,'').trim())).filter(r=>r.length>=5&&r.slice(1,5).every(num))
  .map(r=>({n:r[0],v:r.slice(1,5).map(x=>Math.max(0,Math.round(+x.replace(',','.'))))}))}
function imp(t){const r=csv(t);
 if(!r.length){$('#ms').textContent='CSV não reconhecido: siga o modelo acima.';return}
 U=r;cur=0;$('#ms').textContent=r.length+' unidade(s) importada(s).';fillSel();load()}

$('#cd').onclick=e=>{const b=e.target.closest('.cd');if(b)tg(b.dataset.k)};
$('#al').onclick=()=>{const a=![...K].every(x=>on[x]);[...K].forEach(k=>tg(k,a))};
document.querySelectorAll('#pn input:not([type=file])').forEach(i=>i.oninput=upd);
$('#fl').onchange=e=>{const f=e.target.files[0];if(f){const r=new FileReader();r.onload=()=>imp(r.result);r.readAsText(f)}e.target.value=''};
$('#ex').onclick=()=>imp(SAMPLE);
$('#us').onchange=e=>{cur=+e.target.value;load()};
const fit=()=>{const k=Math.min(innerWidth/1920,innerHeight/1080);st.style.transform=`translate(-50%,-50%) scale(${k})`};
addEventListener('resize',fit);fit();fillSel();load();
</script></body></html>
